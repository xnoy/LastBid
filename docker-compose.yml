# Local infrastructure for BidNova (Postgres + Redis).
# Run:  docker compose up -d
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bidnova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bidnova
      POSTGRES_PASSWORD: bidnova
      POSTGRES_DB: bidnova
    ports:
      - "5432:5432"
    volumes:
      - bidnova-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bidnova-redis
    restart: unless-stopped
    # appendonly keeps the live auction state durable across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bidnova-redisdata:/data

volumes:
  bidnova-pgdata:
  bidnova-redisdata:
